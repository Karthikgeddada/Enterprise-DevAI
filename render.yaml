# Render deployment for the DevTeam AI FastAPI backend.
# Docs: https://render.com/docs/blueprint-spec
# After the first deploy, set OPENROUTER_API_KEY in the Render dashboard
# (Environment tab) - it is marked sync:false so it is NOT committed here.
services:
  - type: web
    name: enterprise-devai
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements-web.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.10"
      - key: LLM_PROVIDER
        value: openrouter
      - key: OPENROUTER_MODEL
        value: deepseek/deepseek-v4.1-flash-1017  # any id from openrouter.ai/models; router picks the cheapest provider
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite  # keep current: Google retires -latest aliases
      # Primary provider: one OpenRouter key, many models, per-key spend limits
      - key: OPENROUTER_API_KEY
        sync: false
      # Optional fallback provider (choose per run in the UI when its key is set)
      # - key: GEMINI_API_KEY
      #   sync: false
      # Optional: lock CORS to your Vercel frontend URL (default allows all)
      # - key: ALLOWED_ORIGIN
      #   value: https://your-app.vercel.app
