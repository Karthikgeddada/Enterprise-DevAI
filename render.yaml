# Render deployment for the DevTeam AI FastAPI backend.
# Docs: https://render.com/docs/blueprint-spec
# After the first deploy, set GEMINI_API_KEY in the Render dashboard
# (Environment tab) - it is marked sync:false so it is NOT committed here.
services:
  - type: web
    name: enterprise-devai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-web.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.10"
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      # Optional: lock CORS to your Vercel frontend URL (default allows all)
      # - key: ALLOWED_ORIGIN
      #   value: https://your-app.vercel.app
      - key: GEMINI_API_KEY
        sync: false
      # Optional: OpenRouter as alternative provider (set LLM_PROVIDER=openrouter)
      # - key: OPENROUTER_API_KEY
      #   sync: false
